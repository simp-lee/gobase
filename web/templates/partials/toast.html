{{ define "toast" }}
{{ if .Flash }}
<div class="fixed top-4 right-4 z-[60] space-y-2" aria-live="polite">
    {{ if .Flash.Success }}
    <div class="max-w-sm rounded-lg bg-green-500 px-4 py-3 text-sm font-medium text-white shadow-lg" role="status" data-toast-type="success">{{ .Flash.Success }}</div>
    {{ end }}
    {{ if .Flash.Error }}
    <div class="max-w-sm rounded-lg bg-red-500 px-4 py-3 text-sm font-medium text-white shadow-lg" role="status" data-toast-type="error">{{ .Flash.Error }}</div>
    {{ end }}
    {{ if .Flash.Info }}
    <div class="max-w-sm rounded-lg bg-blue-500 px-4 py-3 text-sm font-medium text-white shadow-lg" role="status" data-toast-type="info">{{ .Flash.Info }}</div>
    {{ end }}
</div>
{{ end }}
{{ end }}
